name: Build Production Corpus Working Set

on:
  workflow_dispatch:
    inputs:
      target_ingredients:
        description: Curated/high ingredient target before pilot
        required: true
        default: '600'
        type: string
      commit_results:
        description: Commit the generated working bundle and audit evidence to the invoking branch
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate production control plane
        run: |
          npm run corpus:4pa
          npm run corpus:4pb
          npm run corpus:4pc
          npm run lint
          npm test

      - name: Acquire official USDA FoodData Central sources
        run: |
          npm run corpus:fetch-fdc -- usda-foundation-2026-04 corpus/sources/cache
          npm run corpus:fetch-fdc -- usda-sr-legacy-2018-04 corpus/sources/cache
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const foundation = JSON.parse(fs.readFileSync('corpus/sources/cache/usda-foundation-2026-04/acquisition-manifest.json','utf8'));
          const sr = JSON.parse(fs.readFileSync('corpus/sources/cache/usda-sr-legacy-2018-04/acquisition-manifest.json','utf8'));
          if (!foundation.primaryJsonFile || !sr.primaryJsonFile) throw new Error('Acquisition manifest did not identify primary JSON files');
          fs.appendFileSync(process.env.GITHUB_ENV, `FOUNDATION_JSON=${foundation.primaryJsonFile}\nSR_JSON=${sr.primaryJsonFile}\n`);
          NODE

      - name: Import USDA sources as review intake
        run: |
          mkdir -p corpus/staging/runtime
          npm run corpus:import-usda -- "$FOUNDATION_JSON" corpus/staging/runtime/foundation-review.json
          npm run corpus:import-usda-sr -- "$SR_JSON" corpus/staging/runtime/sr-review.json

      - name: Deterministic high-confidence review
        run: |
          npm run corpus:auto-curate-fdc -- \
            corpus/staging/runtime/foundation-review.json \
            corpus/staging/runtime/sr-review.json \
            corpus/staging/runtime/fdc-auto-curated \
            "${{ inputs.target_ingredients }}"

      - name: Materialize curated/high ingredient foundation
        run: |
          npm run corpus:materialize-usda -- \
            corpus/staging/runtime/fdc-auto-curated/usda-foundation-reviewed.json \
            corpus/staging/runtime/materialized-foundation \
            1.0.0-production-foundation
          npm run corpus:materialize-usda -- \
            corpus/staging/runtime/fdc-auto-curated/usda-sr-legacy-reviewed.json \
            corpus/staging/runtime/materialized-sr \
            1.0.0-production-foundation
          npm run corpus:combine-materialized -- \
            corpus/staging/runtime/materialized-combined \
            corpus/staging/runtime/materialized-foundation \
            corpus/staging/runtime/materialized-sr

      - name: Retire Phase 1 ingredient and recipe fixtures explicitly
        run: |
          npm run corpus:generate-fixture-retirement -- \
            corpus/staging/runtime/materialized-combined \
            corpus/curation/v1-legacy-fixture-retirement.json
          npm run corpus:merge-curated-ingredients -- \
            public/data \
            corpus/staging/runtime/materialized-combined \
            corpus/staging/runtime/production-foundation-bundle.json \
            corpus/curation/v1-legacy-fixture-retirement.json
          npm run corpus:retire-recipe-fixtures -- \
            corpus/staging/runtime/production-foundation-bundle.json \
            corpus/curation/v1-legacy-fixture-retirement.json \
            corpus/staging/runtime/production-foundation-clean-bundle.json \
            corpus/staging/runtime/development-fixture-retirement.json

      - name: Require pilot readiness
        run: |
          npm run corpus:production-readiness -- \
            corpus/staging/runtime/production-foundation-clean-bundle.json \
            corpus/contracts/v1-production.json \
            corpus/policies/v1-default.json \
            corpus/staging/runtime/production-readiness.json \
            --pilot-strict

      - name: Execute all six production pilot waves
        run: |
          npm run corpus:pilot-execute -- \
            corpus/staging/runtime/production-foundation-clean-bundle.json \
            corpus/staging/runtime/production-pilot \
            --canonical

      - name: Require Scale Gate 500 to open
        run: |
          npm run corpus:scale-gate-500 -- \
            corpus/staging/runtime/production-pilot/pilot-corpus-bundle.json \
            corpus/staging/runtime/scale-gate-after-pilot.json \
            corpus/staging/runtime/snapshot-after-pilot.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gate = JSON.parse(fs.readFileSync('corpus/staging/runtime/scale-gate-after-pilot.json','utf8'));
          if (gate.status !== 'ready') throw new Error(`Expected Scale Gate 500 ready after pilot; got ${gate.status}: ${gate.blockers.join('; ')}`);
          NODE

      - name: Execute first industrialized 4P-C batch
        run: |
          npm run corpus:first-scale-batch -- \
            corpus/staging/runtime/production-pilot/pilot-corpus-bundle.json \
            corpus/staging/runtime/scale-batch-001 \
            --canonical

      - name: Verify generated working set
        run: |
          node scripts/corpus/production-readiness.mjs \
            corpus/staging/runtime/scale-batch-001/output-corpus-bundle.json \
            corpus/contracts/v1-production.json \
            corpus/policies/v1-default.json \
            corpus/staging/runtime/readiness-after-scale-001.json
          npm run lint
          npm test
          npm run corpus:4pa
          node scripts/corpus/validate-production-pass-c.mjs

      - name: Stage auditable working result
        run: |
          mkdir -p corpus/production/evidence
          cp corpus/staging/runtime/scale-batch-001/output-corpus-bundle.json corpus/production/current-working-bundle.json
          cp corpus/sources/cache/usda-foundation-2026-04/acquisition-manifest.json corpus/production/evidence/foundation-acquisition.json
          cp corpus/sources/cache/usda-sr-legacy-2018-04/acquisition-manifest.json corpus/production/evidence/sr-legacy-acquisition.json
          cp corpus/staging/runtime/fdc-auto-curated/auto-curation-report.json corpus/production/evidence/auto-curation-report.json
          cp corpus/staging/runtime/materialized-combined/materialization-manifest.json corpus/production/evidence/materialization-manifest.json
          cp corpus/staging/runtime/development-fixture-retirement.json corpus/production/evidence/development-fixture-retirement.json
          cp corpus/staging/runtime/production-pilot/pilot-summary.json corpus/production/evidence/pilot-summary.json
          cp corpus/staging/runtime/scale-batch-001/summary.json corpus/production/evidence/first-scale-batch-summary.json
          cp corpus/staging/runtime/scale-batch-001/after-scale-gate.json corpus/production/evidence/scale-gate-after-first-batch.json

      - name: Upload production corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-corpus-working-set-${{ github.run_number }}
          path: |
            corpus/production/current-working-bundle.json
            corpus/production/evidence
            corpus/curation/v1-legacy-fixture-retirement.json
            corpus/pilot/v1-pilot-intake.json
            corpus/pilot/v1-reference-data-proposals.json
            corpus/pilot/reports
            corpus/reports/first-scale-batch-summary.json
            corpus/reports/scale-gate-500.json
            corpus/staging/runtime/fdc-auto-curated/auto-curation-report.json
            corpus/staging/runtime/production-readiness.json
            corpus/staging/runtime/production-pilot/pilot-summary.json
            corpus/staging/runtime/production-pilot/wave-*-report.json
            corpus/staging/runtime/scale-gate-after-pilot.json
            corpus/staging/runtime/scale-batch-001/summary.json
            corpus/staging/runtime/scale-batch-001/batch-report.json
            corpus/sources/cache/usda-foundation-2026-04/acquisition-manifest.json
            corpus/sources/cache/usda-sr-legacy-2018-04/acquisition-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated working set
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/production/current-working-bundle.json corpus/production/evidence corpus/curation/v1-legacy-fixture-retirement.json corpus/pilot corpus/reports corpus/snapshots corpus/runs corpus/jobs corpus/intake
          if git diff --cached --quiet; then
            echo "No generated corpus changes to commit"
          else
            git commit -m "data: execute Phase 4 production foundation and pilot"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
