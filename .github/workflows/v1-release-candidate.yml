name: Verify V1 Planner Phase B Corpus

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-planner-phase-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1-planner-phase-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild Phase B planner corpus
        run: |
          npm run corpus:build-planner-phase-b
          npm run catalog:publish-planner-phase-b

      - name: Verify generated Phase B data has no drift
        run: |
          git diff --exit-code -- \
            corpus/production/planner-phase-b \
            public/data/catalog-manifest.json \
            public/data/ingredients \
            public/data/recipes \
            public/data/reference-data

      - name: Select browser for acceptance gate
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chrome/Chromium executable found on the runner" >&2
            exit 1
          fi
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Verify planner-validation build
        run: npm run check
        env:
          YDM_BROWSER_REQUIRED: '1'

      - name: Verify Phase B explicitly
        run: npm run v1:planner-phase-b

      - name: Build GitHub Pages planner-validation artifact
        run: npm run build
        env:
          YDM_BASE_PATH: /yourDietManager/

      - name: Audit GitHub Pages artifact
        run: node scripts/hardening/pages-audit.mjs dist /yourDietManager/

      - name: Upload planner-validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: yourdietmanager-planner-phase-b-${{ github.run_number }}
          path: |
            dist
            corpus/production/planner-phase-b/build-evidence.json
            corpus/production/planner-phase-b/publication-evidence.json
            corpus/production/planner-phase-b/recipe-eligibility.json
            V1_PLANNER_VALIDATION_PLAN.md
            V1_PLANNER_PHASE_B_REPORT.md
          if-no-files-found: error
          retention-days: 14
