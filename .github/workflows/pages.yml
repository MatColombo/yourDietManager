name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select browser for acceptance gate
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chrome/Chromium executable found on the runner" >&2
            exit 1
          fi
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          echo "Browser acceptance executable: $browser"
          "$browser" --version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify application
        run: npm run check
        env:
          YDM_BROWSER_REQUIRED: '1'

      - name: Build for GitHub Pages
        run: npm run build
        env:
          YDM_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify Pages artifact
        run: node scripts/hardening/pages-audit.mjs dist "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
